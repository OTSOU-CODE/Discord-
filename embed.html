<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كود التضمين — TrustWall</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-content">
            <a href="dashboard.html" class="logo">🛡️ TrustWall</a>
            <div class="nav-links">
                <a href="dashboard.html" class="btn-outline">العودة للوحة</a>
            </div>
        </div>
    </nav>

    <main class="dashboard">
        <div class="container">
            <h1>كود التضمين (Embed Widget) 📎</h1>
            <p style="color: var(--gray); margin-top: 0.25rem;">انسخ هذا الكود وألصقه في أي موقع أو متجر إلكتروني لعرض الشهادات مباشرة</p>

            <div class="embed-section">
                <div class="form-group">
                    <label style="font-weight: 700; margin-bottom: 0.5rem; display: block;">كود HTML الجاهز للتضمين:</label>
                    <textarea id="embedCode" rows="9" readonly class="code-block" style="width: 100%; box-sizing: border-box;"></textarea>
                    <button onclick="copyEmbed()" class="btn-primary" style="margin-top: 0.5rem;">📋 نسخ الكود</button>
                </div>

                <h3 style="margin-top: 2.5rem; margin-bottom: 1rem;">معاينة حية للودجت:</h3>
                <div id="previewContainer" class="embed-preview"></div>
            </div>
        </div>
    </main>

    <script src="js/storage.js"></script>
    <script src="js/embed.js"></script>
</body>
</html>
