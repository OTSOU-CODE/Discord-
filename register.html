<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب — TrustWall</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-box">
            <a href="index.html" class="auth-logo">🛡️ TrustWall</a>
            <h1>إنشاء حساب جديد</h1>
            <p>ابدأ جمع شهادات عملائك في دقائق معدودة</p>

            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label>الاسم الكامل</label>
                    <input type="text" id="name" required placeholder="محمد الزروالي">
                </div>
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="email" required placeholder="your@email.com">
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="password" required placeholder="••••••••" minlength="6">
                </div>
                <button type="submit" class="btn-primary btn-full">إنشاء الحساب</button>
            </form>

            <div id="errorMsg" class="error-msg" style="display:none;"></div>

            <p class="auth-footer">لديك حساب بالفعل؟ <a href="login.html">سجّل دخولك</a></p>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
