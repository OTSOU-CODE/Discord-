<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شارك تجربتك — TrustWall</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/submit.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="submit-page">
        <div class="submit-card">
            <div class="submit-header">
                <h1 id="welcomeMsg">شارك تجربتك معنا</h1>
                <p>رأيك يهمنا ويساعدنا على تقديم الأفضل دائماً</p>
            </div>

            <form id="submitForm" enctype="multipart/form-data">
                <div class="form-group">
                    <label>اسمك الكامل *</label>
                    <input type="text" name="author_name" required placeholder="مثال: محمد الزروالي">
                </div>

                <div class="form-group">
                    <label>بريدك الإلكتروني (اختياري)</label>
                    <input type="email" name="author_email" placeholder="your@email.com">
                </div>

                <div class="form-group">
                    <label>تقييمك *</label>
                    <div class="rating-input">
                        <label><input type="radio" name="rating" value="5" checked> ⭐⭐⭐⭐⭐ (ممتاز)</label>
                        <label><input type="radio" name="rating" value="4"> ⭐⭐⭐⭐ (جيد جداً)</label>
                        <label><input type="radio" name="rating" value="3"> ⭐⭐⭐ (متوسط)</label>
                        <label><input type="radio" name="rating" value="2"> ⭐⭐ (مقبول)</label>
                        <label><input type="radio" name="rating" value="1"> ⭐ (ضعيف)</label>
                    </div>
                </div>

                <div class="form-group">
                    <label>تجربتك ورأيك *</label>
                    <textarea name="content" required rows="4" placeholder="اكتب تفاصيل تجربتك وانطباعك هنا..."></textarea>
                </div>

                <div class="form-group">
                    <label>صورتك الشخصية (اختياري)</label>
                    <input type="file" name="image" accept="image/*">
                </div>

                <button type="submit" class="btn-primary btn-full btn-large">إرسال الشهادة</button>
            </form>

            <div id="successMsg" class="success-msg" style="display:none;">
                <h3>🎉 شكراً جزيلاً لك!</h3>
                <p>تم استلام رأيك بنجاح وسيتم نشره بعد المراجعة.</p>
            </div>

            <div id="errorMsg" class="error-msg" style="display:none;"></div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/submit.js"></script>
</body>
</html>
