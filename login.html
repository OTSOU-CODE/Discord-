<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول — TrustWall</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-box">
            <a href="index.html" class="auth-logo">🛡️ TrustWall</a>
            <h1>تسجيل الدخول</h1>
            <p>أهلاً بعودتك! سجّل دخولك للوحة التحكم</p>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="email" required placeholder="demo@trustwall.com" value="demo@trustwall.com">
                </div>
                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="password" required placeholder="••••••••" value="password123">
                </div>
                <button type="submit" class="btn-primary btn-full">تسجيل الدخول</button>
            </form>

            <div id="errorMsg" class="error-msg" style="display:none;"></div>

            <p class="auth-footer">ليس لديك حساب؟ <a href="register.html">سجّل الآن مجاناً</a></p>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
